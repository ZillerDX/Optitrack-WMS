name: OptiTrack WMS - CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, types, tests, audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Unit / API tests
        run: npm test

      # Fails the build on a known high or critical advisory in what ships to production.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify PWA assets
        run: |
          test -f public/manifest.json || { echo "manifest.json missing"; exit 1; }
          test -f public/sw.js || { echo "sw.js missing"; exit 1; }
          test -f public/offline.html || { echo "offline.html missing"; exit 1; }
          echo "PWA core files verified!"

      # The secrets below are placeholders: the build only needs the variables to exist
      # to be evaluated lazily at request time; nothing here talks to a real service.
      - name: Build Next.js production app
        env:
          SECRET_KEY: ci-build-only-secret-key-0123456789-abcdef
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: optitrack-wms-build
          path: |
            frontend/.next/standalone
            frontend/public
          retention-days: 7

  migrations:
    name: SQL migrations apply cleanly (twice)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Supabase provides these roles; the migrations grant to / revoke from them.
      - name: Create the roles Supabase provides
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Apply them again (each must be idempotent)
        run: |
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
